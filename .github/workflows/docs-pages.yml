name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build VitePress docs
        env:
          VITEPRESS_BASE: /fews-web-oc-components/
        run: npm run docs:build

      - name: Build Storybook
        run: npm run -w @deltares/fews-web-oc-components build-storybook -- --output-dir storybook-static

      - name: Compose static site artifact
        run: |
          mkdir -p _site/storybook
          cp -R docs/.vitepress/dist/. _site/
          cp -R packages/components/storybook-static/. _site/storybook/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
